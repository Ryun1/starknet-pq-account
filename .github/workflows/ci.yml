name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Candidate crates match baseline + pinned patches
        run: vendor/provably-fast/falcon-512/make_crates.sh --check
      - name: Build
        working-directory: contracts
        run: scarb build
      - name: Test
        working-directory: contracts
        run: scarb cairo-test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kit verifier-switch gates
        working-directory: signer
        run: npm install --no-package-lock --no-audit --no-fund && node verifier_switch_check.mjs

  falcon-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Baseline and candidate verifiers agree with the reference on every vector
        run: bench/pf03/run.sh

  recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Test
        working-directory: recovery
        run: scarb cairo-test
      - name: Execute (Braavos profile, public test mnemonic)
        working-directory: recovery
        run: scarb execute --arguments-file args/braavos.json --print-program-output --print-resource-usage --target bootloader --output none
