name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - name: Candidate crates match baseline + pinned patches
        run: vendor/provably-fast/falcon-512/make_crates.sh --check && vendor/provably-fast/falcon-1024/make_crates.sh --check && vendor/provably-fast/ml-dsa-44/make_crates.sh --check
      - name: Build
        working-directory: contracts
        run: scarb build
      - name: Test
        working-directory: contracts
        run: scarb cairo-test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kit verifier-switch gates
        working-directory: signer
        run: npm install --no-package-lock --no-audit --no-fund && node verifier_switch_check.mjs && node verifiers_check.mjs && node scheme_switch_check.mjs

  # Release testnet-v1's classes are declared on Sepolia from scarb 2.18.0 builds (Sierra 1.8.0),
  # so the manifest and the page, which pin their class hashes, are checked against that toolchain.
  # Everything else builds with 2.22.0: on 2026-11-26 the Sepolia gateway declared only Sierra 1.10.0.
  release-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Build (release toolchain)
        working-directory: contracts
        run: scarb build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install kit dependencies
        working-directory: signer
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Built classes match the release manifest
        run: node scripts/release_manifest.mjs --check
      - name: docs/index.html is built from its template
        run: node scripts/build_page.mjs --check

  falcon-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - name: Baseline and candidate verifiers agree with the reference on every vector
        run: bench/pf03/run.sh

  falcon1024-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - name: Falcon-1024 baseline and pinned record agree with the reference on every vector
        run: bench/pf14/run.sh

  mldsa44-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - name: ML-DSA-44 baseline, pinned record and cached check agree with the reference on every vector
        run: bench/pf13/correctness/run.sh

  pf14-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - uses: foundry-rs/setup-snfoundry@v5
        with:
          starknet-foundry-version: "0.64.1"
      # setup-snfoundry installs the latest universal-sierra-compiler; pin the one budgets.json
      # was measured with (it compiles the test classes, so it changes gas).
      - uses: software-mansion/setup-universal-sierra-compiler@v1
        with:
          universal-sierra-compiler-version: "2.11.0-rc.1"
      - name: Falcon-1024 account-level gas, class sizes and libfuncs within network limits and budgets
        run: bench/pf14/gas/run.sh --check

  pf13-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - uses: foundry-rs/setup-snfoundry@v5
        with:
          starknet-foundry-version: "0.64.1"
      # bench/pf13/gas/budgets.json was measured with 2.11.0-rc.1, as bench/pf14/gas.
      - uses: software-mansion/setup-universal-sierra-compiler@v1
        with:
          universal-sierra-compiler-version: "2.11.0-rc.1"
      - name: ML-DSA-44 account-level gas, class sizes and libfuncs within network limits and budgets
        run: bench/pf13/gas/run.sh --check

  pf04-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - uses: foundry-rs/setup-snfoundry@v5
        with:
          starknet-foundry-version: "0.64.1"
      # setup-snfoundry installs the latest universal-sierra-compiler; pin the one budgets.json
      # was measured with (it compiles the test classes, so it changes gas).
      - uses: software-mansion/setup-universal-sierra-compiler@v1
        with:
          universal-sierra-compiler-version: "2.11.0-rc.1"
      - name: Account-level gas, class sizes and libfuncs within network limits and budgets
        run: bench/pf04/run.sh --check

  recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.22.0"
      - name: Test
        working-directory: recovery
        run: scarb cairo-test
      - name: Execute (Braavos profile, public test mnemonic)
        working-directory: recovery
        run: scarb execute --arguments-file args/braavos.json --print-program-output --print-resource-usage --target bootloader --output none
