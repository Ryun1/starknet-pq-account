# PF-03 differential suite: every vector in vectors.json through the baseline and the candidate
# Falcon-512 SHAKE-256 verifiers. src/vectors.cairo is generated by gen_tests.py.
[package]
name = "pf03_differential"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"
license = "MIT"

[dependencies]
starknet = "2.18.0"
pqbench_falcon_512 = { path = "../../vendor/cairo-pq-verifiers/crates/falcon_512" }
pqbench_falcon_512_pf_compact = { path = "../../vendor/provably-fast/falcon-512/crates/falcon_512_pf_compact" }
pqbench_falcon_512_pf_record = { path = "../../vendor/provably-fast/falcon-512/crates/falcon_512_pf_record" }
pqbench_falcon_512_pf_small = { path = "../../vendor/provably-fast/falcon-512/crates/falcon_512_pf_small" }

[dev-dependencies]
cairo_test = "2.18.0"

[cairo]
enable-gas = true
