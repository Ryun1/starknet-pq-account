# PF-14 differential suite: every vector in vectors.json through the baseline and the pinned
# Falcon-1024 verifiers. src/vectors.cairo is generated by gen_tests.py.
[package]
name = "pf14_differential"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"
license = "MIT"

[dependencies]
starknet = "2.18.0"
pqbench_interface = { path = "../../vendor/cairo-pq-verifiers/crates/bench_interface" }
pqbench_falcon_1024 = { path = "../../vendor/cairo-pq-verifiers/crates/falcon_1024" }
pqbench_falcon_1024_pf_record = { path = "../../vendor/provably-fast/falcon-1024/crates/falcon_1024_pf_record" }

[dev-dependencies]
cairo_test = "2.18.0"

[cairo]
enable-gas = true
