# PF-14 account-level benchmarks: the Falcon-1024 verifier class on HybridMigratableAccountV2,
# built from contracts/, measured with snforge. src/cases.cairo is generated by gen_tests.py.
[package]
name = "pf14_gas"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.22.0"
license = "MIT"

[dependencies]
starknet = "2.22.0"
pq_hybrid = { path = "../../../contracts" }

[dev-dependencies]
snforge_std = "0.64.1"
assert_macros = "2.22.0"

[[target.starknet-contract]]
build-external-contracts = [
    "pq_hybrid::hybrid::HybridShakeVerifierFalcon1024",
    "pq_hybrid::hybrid::HybridShakeVerifierPfSmallKeyRead",
    "pq_hybrid::migratable_v2::HybridMigratableAccountV2",
]

[scripts]
test = "snforge test"

[cairo]
enable-gas = true
