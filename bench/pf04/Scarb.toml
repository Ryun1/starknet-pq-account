# PF-04 account-level benchmarks: this project's hybrid classes, built from contracts/, measured
# with snforge. src/cases.cairo is generated by gen_tests.py.
[package]
name = "pf04_bench"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"
license = "MIT"

[dependencies]
starknet = "2.18.0"
pq_hybrid = { path = "../../contracts" }

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.18.0"

[[target.starknet-contract]]
build-external-contracts = [
    "pq_hybrid::hybrid::HybridShakeAccount",
    "pq_hybrid::hybrid::HybridShakeVerifierPfCompact",
    "pq_hybrid::hybrid::HybridShakeVerifierPfRecord",
    "pq_hybrid::migratable::HybridMigratableAccount",
]

[scripts]
test = "snforge test"

[cairo]
enable-gas = true
