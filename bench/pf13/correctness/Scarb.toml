# PF-13 differential suite: every vector in vectors.json through the ML-DSA-44 baseline, the pinned
# record and the record's cached check, plus the cache's own tests and NIST ACVP on the baseline.
# src/*.cairo except lib.cairo is generated by gen_tests.py.
[package]
name = "pf13_differential"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.22.0"
license = "MIT"

[dependencies]
starknet = "2.22.0"
pqbench_interface = { path = "../../../vendor/cairo-pq-verifiers/crates/bench_interface" }
pqbench_ml_dsa_44 = { path = "../../../vendor/cairo-pq-verifiers/crates/ml_dsa_44" }
pqbench_ml_dsa_44_pf_record = { path = "../../../vendor/provably-fast/ml-dsa-44/crates/ml_dsa_44_pf_record" }

[dev-dependencies]
cairo_test = "2.22.0"

[cairo]
enable-gas = true
