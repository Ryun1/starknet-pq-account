# Provably Fast Falcon-512 candidates, generated by make_crates.sh (MIT). Same workspace
# settings as vendor/cairo-pq-verifiers, whose bench_interface they share.
[workspace]
members = [
    "crates/falcon_512_pf_compact",
    "crates/ntt_pf_compact",
    "crates/falcon_512_pf_record",
    "crates/ntt_pf_record",
    "crates/falcon_512_pf_small",
    "crates/ntt_pf_small",
]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"
scarb-version = "2.18.0"
authors = ["OpenZeppelin Community <maintainers@openzeppelin.org>"]
license = "MIT"

[workspace.dependencies]
starknet = "2.18.0"
snforge_std = "0.59.0"
assert_macros = "2.18.0"
pqbench_interface = { path = "../../cairo-pq-verifiers/crates/bench_interface" }

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
