# Vendored subset of OpenZeppelin/cairo-pq-verifiers (MIT). Only the crates this repo uses.
# crates/falcon_1024 is from the Provably Fast Falcon-1024 baseline, bf7fd87 (PF-14; see
# vendor/provably-fast/falcon-1024/PROVENANCE.md); crates/ml_dsa_44 is from the
# Provably Fast ML-DSA-44 baseline, 78c8359 (PF-13; see vendor/provably-fast/ml-dsa-44/PROVENANCE.md);
# the rest is bece5c07.
[workspace]
members = [
    "crates/bench_interface",
    "crates/ecdsa_stark",
    "crates/falcon_512",
    "crates/falcon_1024",
    "crates/ml_dsa_44",
    "crates/ntt",
]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"
scarb-version = "2.18.0"
authors = ["OpenZeppelin Community <maintainers@openzeppelin.org>"]
license = "MIT"

[workspace.dependencies]
starknet = "2.18.0"
snforge_std = "0.59.0"
assert_macros = "2.18.0"
# OZ test signing/deploy helpers, from the Scarb registry (keeps this repo self-contained).
openzeppelin_testing = "6.7.0"
# Internal crates.
pqbench_interface = { path = "crates/bench_interface" }

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
